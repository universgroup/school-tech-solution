{% extends "base.html" %}
{% block titre_page %} MIS A JOUR {% endblock %}
{% block titre_cadre %}
EDITION D'UNE ANNEE SCOLAIRE
{% endblock %}

{% block formulaire %}

 <form class="form-horizontal" action="{% url 'modifieanneescolaire' ansc.id %}" method="POST">

                {% csrf_token %}

                <div class="row">
                    <div class="col-md-12">
                        <div class="form-group">
                            <label for="IDAns">ID</label>
                            <input type="text" id="IDAns" maxlength="10" value="{{ansc.id}}" class="form-control" required readonly>
                        </div>
                    </div>
                </div>
                <div class="row">
                    <div class="col-md-12">
                        <div class="form-group">
                            <label for="id_ansc">Année scolaire</label>
                            <input type="text" name="descript_annee" id="id_ansc" maxlength="10"  value="{{ansc.descript_annee}}" class="form-control" required>
                        </div>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-12">
                        <div class="text-center">
                            <button type="submit" class="btn btn-success btn-sm">Modifier &nbsp;<i class="fa fa-pencil-square"></i></button>
                            <a href="{% url 'listeanneescolaire' %}" target="_self" class="btn btn-primary btn-sm">Retour &nbsp;<i class="fa fa-arrow-circle-left"></i></a>
                        </div>
                    </div>
                </div>

 </form>

{% endblock %}
