{% extends "base.html" %}
{% block titre_page %} EDITION DES AVANCES SUR SALAIRE {% endblock %}
{% block titre_cadre %}
EDITION D'UNE AVANCE SUR SALAIRE
{% endblock %}

{% block formulaire %}

<div class="row">
    <div class="col-lg-6">
        <div class="card m-b-30">
            <form class="post-form" action="/modifieravancesalaire/{{avsal.id}}" method="POST">

                {% csrf_token %}

                <div class="row">
                    <div class="col-lg-6">
                        <div class="card m-b-30">

                            <label for="Idavsal">ID Avance</label>
                            <input type="text" id="Idavsal" maxlength="10" value="{{avsal.id}}" class="form-control" required readonly>
                            
                            <label for="id_intitule">Intitulé</label>
                            <input type="text" name="intitule" id="id_intitule" maxlength="100"  value="{{avsal.intitule}}" class="form-control" required>


                            <label for="id_mntavance">Montant Avancé</label>
                            <input type="text" name="montant_avance" id="id_mntavance" maxlength="30"  value="{{avsal.montant_avance}}" class="form-control" required>
                            
                                                      
                            <label for="id_moisavance">Mois Avancé</label>
                            <input type="text" name="mois_avance" id="id_moisavance" maxlength="15"  value="{{avsal.mois_avance}}" class="form-control" required>
                            
                                                        
                            <label for="id_anneescolaire">Année scolaire</label>
                            <input type="text" name="annee_scolaire" id="id_type_pers" maxlength="15"  value="{{avsal.anscolaire}}" class="form-control" readonly>
                            
                            <label for="id_pers">Employé</label>
                            <input type="text" name="idpersonnel" id="id_pers" maxlength="15"  value="{{avsal.idpersonnel}}" class="form-control" readonly>

                        </div>
                    </div>

                </div>



                <div class="row">
                    <div class="col-lg-6">
                        <button type="submit" class="btn btn-success"><span class="glyphicon glyphicon-pencil">Modifier</span></button>
                        <a href="/ajouteravancesalaire/" target="_self" class="btn btn-secondary"><span class="glyphicon glyphicon-arrow-left">Retour</span></a>
                    </div>

                </div>


            </form>
        </div>

    </div>
</div>

{% endblock %}
