{% extends 'base.html' %}
{% block content %}
<h1>Nouveau mot de passe</h1>
{% if validlink %}
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">Réinitialiser</button>
</form>
{% else %}
<p class="text-danger">Ce lien de réinitialisation n'est plus valide.</p>
{% endif %}
{% endblock %}
