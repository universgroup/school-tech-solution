<!DOCTYPE html>
<html lang="fr">
<head>
    {% load static %}
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mot de passe réinitialisé - École Les Champions</title>
    <link rel="icon" type="image/png" href="{% static 'assets/dist/img/LogoEC.png' %}">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link rel="stylesheet" href="{% static 'assets/css/loginstyle.css' %}">

    <style>
    .login-form::before,
    .login-brand::after {
        background-image: url("{% static 'assets/dist/img/LogoEC.png' %}");
    }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="login-brand">
            <div class="brand-content">
                <div class="school-logo">
                    <img src="{% static 'assets/dist/img/LogoEC.png' %}" alt="Logo de l'école les Champions" />
                </div>
                <h1>École Les Champions</h1>
                <p>L'excellence au service de l'éducation</p>
                <div class="brand-divider"></div>
                <div class="school-feature">
                    <span><i class="fas fa-check-circle"></i> 15 ans d'excellence</span>
                    <span><i class="fas fa-users"></i> 1000+ élèves</span>
                    <span><i class="fas fa-award"></i> Label qualité</span>
                </div>
            </div>
        </div>

        <div class="login-form">
            <div class="form-header text-center">
                <i class="fas fa-check-circle fa-3x text-success mb-3"></i>
                <h2>Mot de passe réinitialisé</h2>
                <p>Vous pouvez maintenant vous connecter avec votre nouveau mot de passe.</p>
            </div>

            <a href="{% url 'connexion' %}" class="btn-login d-block text-center text-decoration-none">
                 Se connecter &nbsp;<i class="fas fa-sign-in-alt"></i>
            </a>
        </div>
    </div>
</body>
</html>
